<!-- Render ```mermaid fences. github.com renders them itself; Jekyll does not.
     Kramdown+rouge emits <div class="language-mermaid highlighter-rouge">…<code>,
     so here we load mermaid and swap that block for the <div class="mermaid">
     it looks for. -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  mermaid.initialize({ startOnLoad: false, theme: 'dark' });

  document.querySelectorAll('.language-mermaid').forEach((el) => {
    // With rouge, el is the wrapper div; without a highlighter, el is the <code>.
    const code = el.tagName === 'CODE' ? el : el.querySelector('code');
    const block = el.tagName === 'CODE' ? el.closest('pre') : el;
    if (!code || !block) return;

    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = code.textContent;
    block.replaceWith(div);
  });

  await mermaid.run();
</script>

<style>
  /* The theme styles <pre> blocks; diagrams are plain divs, so give them room. */
  .mermaid {
    margin: 1em 0;
    overflow-x: auto;
    text-align: center;
  }
</style>
